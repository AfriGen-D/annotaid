<h2 id="the-constraints-were-designing-for">The constraints we're designing for</h2>
<table>
<thead>
<tr>
<th>Constraint</th>
<th>What it means for the design</th>
</tr>
</thead>
<tbody>
<tr>
<td>Existing Rocky Linux 9.5 server, other live apps, nginx already running</td>
<td>We fit in beside them: one systemd service on a localhost port, nginx in front. No Docker, no Caddy.</td>
</tr>
<tr>
<td><strong>You have no direct server access</strong></td>
<td>Everything server-side goes into a one-page runbook a sysadmin follows. Admin tasks (users, passwords) need a <strong>web UI</strong>, not a CLI. You also can't read logs, so the app has to show its own errors.</td>
</tr>
<tr>
<td>HTTPS</td>
<td>Handled by the existing nginx. NFR-5 is the sysadmin's job, not ours.</td>
</tr>
<tr>
<td>Python</td>
<td>Rocky 9's default is 3.9. The current code parses as 3.9. ✔</td>
</tr>
<tr>
<td>Dependencies</td>
<td>Standard library + <code>jsonschema</code> only (unchanged)</td>
</tr>
<tr>
<td>Time</td>
<td>1 day build + 1 day test <strong>(see the honest estimate on slide 5)</strong></td>
</tr>
<tr>
<td>Scale</td>
<td>~10–15 accounts, ~2 people working at once</td>
</tr>
</tbody>
</table>
</section>

<h2 id="step-zero-the-multi-project-version-isnt-committed-yet">Step zero: the multi-project version isn't committed yet</h2>
<p>The app you've been building (projects, per-project SQLite store, feature editor, home screen) lives in three places:</p>
<ul>
<li><code>stash@{0}</code> (&quot;WIP on v1&quot;): 20 files, including the new <code>handlers.py</code> with <code>/api/projects/{pid}/...</code> routes and the removal of <code>store.py</code></li>
<li><strong>untracked</strong> files on <code>main</code>: <code>server/db.py</code>, <code>projects.py</code>, <code>project_store.py</code>, <code>features.py</code>, <code>feature_sheet.py</code>, <code>identity.py</code>, <code>static/home.html</code>, 8 JS modules, <code>tests/</code></li>
<li><code>main</code> itself is still the old single-store v1</li>
</ul>
<p>All of v2 is built on that foundation. Right now one <code>git stash drop</code> or <code>git clean</code> would delete it.</p>
<div class="ask">
<p><strong>Decision 1:</strong> which branch does the foundation get committed to (<code>dev</code>, <code>v1</code>, or a new <code>v2</code>)? That's where v2 work happens.</p>
</div>
</section>

<h2 id="two-releases-not-one">Two releases, not one</h2>
<p>Think of it as a building. <strong>R1 locks the doors and gets the lifts working.</strong> <strong>R2 adds the sign-up sheet that says who sits at which desk.</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Contents</th>
<th>Goes live</th>
</tr>
</thead>
<tbody>
<tr>

<h2 id="roles-three-of-them-two-levels">Roles: three of them, two levels</h2>
<p><strong>Account level</strong> (on the user):</p>
<ul>
<li><strong>superadmin</strong>: everything, in every project, plus the admin UI</li>
<li><strong>manager</strong>: may <em>create</em> projects. Creating one makes you its manager.</li>
<li><strong>user</strong>: can only be added to projects by someone else</li>
</ul>
<p><strong>Project level</strong> (membership of a project):</p>
<ul>
<li><strong>manager</strong> of project X: runs X (schema, papers, jobs, team, export)</li>
<li><strong>curator</strong> in project X: curates papers in X</li>
</ul>
<p>One person can manage project A and curate in project B.</p>
<p><strong>Not a member?</strong> Every <code>/api/projects/{pid}/...</code> call returns <strong>404, not 403</strong>, so outsiders can't even confirm the project exists (M2: &quot;without revealing data&quot;).</p>
</section>

<h2 id="authentication-how-it-works">Authentication: how it works</h2>
<ul>
<li><strong>Tables:</strong> <code>users</code> (email, name, scrypt hash, account role, active, must-change-password, last login) and <code>sessions</code></li>
<li><strong>Passwords:</strong> <code>hashlib.scrypt</code>, random 16-byte salt per user, minimum 10 characters. Nobody can read a password back, including a superadmin.</li>
<li><strong>Session token:</strong> random 32 bytes in the cookie. The DB stores only its <strong>SHA-256</strong>, so a copy of the database doesn't hand out live logins.</li>
<li><strong>Cookie:</strong> <code>HttpOnly; Secure; SameSite=Lax; Path=/</code>. <code>Secure</code> is always on in production, with a <code>--dev</code> flag to turn it off for local http testing.</li>
<li><strong>Expiry:</strong> 12 h idle, 7 days absolute. Logout, password reset and deactivation delete the session rows immediately.</li>
<li><strong>Login errors:</strong> always &quot;email or password is incorrect&quot;. After 5 failures per email in 15 minutes there's a short lockout (held in memory).</li>
<li><strong>CSRF:</strong> <code>SameSite=Lax</code>, plus every POST must carry an <code>Origin</code> matching the host. nginx must pass <code>Host</code> through (it's in the runbook).</li>
<li><strong>The gate:</strong> one check in <code>app._dispatch</code>. Only <code>/login</code>, <code>POST /api/login</code> and the login page's own CSS/JS are public. Everything else without a session gets <code>401</code> (API) or a redirect to <code>/login?next=…</code> (pages). That includes <code>pdf.js</code> and every PDF.</li>
</ul>
</section>

<p>Today (<code>server/identity.py</code>): one <code>singleton</code> row holds a name, an email and an <strong>optional personal OpenRouter key</strong>, which overrides the server key in <code>h_extract</code>.</p>

<ul>

<li>The OpenRouter key exists <strong>only</strong> in the server's env file (NFR-7). The <code>app_identity</code> table is dropped.</li>
<li>Code that changes: <code>identity.py</code> (removed), <code>h_config</code> (&quot;extraction available&quot; now depends only on the server key), <code>h_extract</code>, <code>static/js/userIdentity.js</code> and <code>identityBox.js</code> (replaced by a small &quot;signed in as … · change password · log out&quot; menu)</li>
<li><code>projects.created_by_name/email</code> becomes <code>created_by</code> (a user id)</li>
</ul>
<p><span class="small">That's four files plus the UI, not a 30-minute job. Estimated at 1 h in item 4.</span></p>

<h2 id="the-first-superadmin-the-chicken-and-egg-problem">The first superadmin: the chicken-and-egg problem</h2>
<p>The admin UI creates users, but someone has to log in first, and you can't run commands on the server.</p>
<table>
<thead>
<tr>
<th>Option</th>
<th>How</th>
<th>Risk</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A. Env-file bootstrap</strong> (recommended)</td>
<td>Sysadmin adds <code>ANNOTAID_ADMIN_EMAIL</code> + <code>ANNOTAID_ADMIN_PASSWORD</code> to the same env file as the OpenRouter key. On startup, <strong>if no superadmin exists</strong>, the app creates one with must-change-password set. Ignored afterwards.</td>
<td>Password sits in a root-readable file until you change it, and the forced change makes it useless after that</td>
</tr>
<tr>
<td>B. <code>/setup</code> page while <code>users</code> is empty</td>
<td>First person to open the URL becomes superadmin</td>
<td>Whoever gets there first owns the system. On a public URL that's a race you might lose.</td>
</tr>
</tbody>
</table>
<div class="ask">
<p><strong>Decision 3:</strong> use option A?</p>
</div>
</section>

<h2 id="background-jobs-the-idea">Background jobs: the idea</h2>
<p>Right now, adding 50 PMIDs means the <strong>browser</strong> fires 50 requests, 3 at a time, and extraction runs inside the HTTP request. Close the tab and the work stops.</p>
<p>A job runner turns that into a <strong>to-do list the server owns</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code> browser ──POST /jobs──▶  jobs + job_items rows (state: queued)
                               │
               one worker thread picks the oldest queued job
                               │
          runs its items, up to N at a time ──▶ writes progress per item
                               │
 browser ──GET /jobs/{id} every 2 s──▶ sees each row: waiting · running · done · failed
</code></pre>
<ul>
<li>One process, one worker thread (NFR-11). It runs <strong>inside</strong> the existing server, so there's no new service to install.</li>
<li>Writes go through the existing <code>Db</code> write lock, the same as everything else</li>
<li>Survives the user leaving the page. Doesn't survive a server restart mid-item (next slide).</li>
</ul>
</section>

<h2 id="background-jobs-the-details">Background jobs: the details</h2>
<p><strong>Tables:</strong> <code>jobs(id, project_id, kind, state, params_json, total, n_done, n_failed, cancel_requested, error, created_by, created/started/finished_at)</code> and <code>job_items(job_id, seq, ref, state, outcome, error, started/finished_at)</code></p>
<table>
<thead>
<tr>
<th></th>
<th><strong>PMID import job</strong> (M14)</th>
<th><strong>Extraction job</strong> (M16)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Input</td>
<td>List of PMIDs (one pasted, a list, or a file)</td>
<td>Paper uids + models + prompt + parse engine + force</td>
</tr>
<tr>
<td>Per item</td>
<td>NCBI verify → open-access PDF chain → store → dedup</td>
<td><code>run_extraction()</code> as today (its 4-wide per-model pool stays; no extra pool on top)</td>
</tr>
<tr>
<td>Outcomes</td>
<td><code>added</code> · <code>duplicate</code> (not an error, M15) · <code>no_pdf</code> · <code>failed: reason</code></td>
<td><code>done</code> · <code>skipped</code> (a good run exists, not forced) · <code>failed: reason</code></td>
</tr>
<tr>
<td><code>no_pdf</code> row</td>
<td>Shows <strong>Upload PDF for this PMID</strong>, using the existing upload with <code>X-Suggested-Pmid</code></td>
<td>n/a</td>
</tr>
<tr>
<td>Items in parallel</td>
<td>N = 3 (NCBI rate limiter already thread-safe) ⓓ</td>
<td>N = 3 ⓓ</td>
</tr>
</tbody>
</table>
<p><strong>States:</strong> job <code>queued → running → done | failed | cancelled</code>; item <code>waiting → running → done | failed | skipped</code><br />
<strong>Cancel:</strong> sets a flag. Running items finish, waiting ones become <code>cancelled</code>.<br />
<strong>Retry:</strong> &quot;Retry failed&quot; makes a <strong>new job</strong> from the failed refs, so successful items never re-run and the old job stays as a record.<br />
<strong>Restart:</strong> on startup, any <code>running</code> item is marked <code>failed: interrupted by server restart</code>, and its job becomes retryable. No silent half-states.<br />
<strong>Endpoints:</strong> <code>POST /api/projects/{pid}/jobs</code>, <code>GET …/jobs</code>, <code>GET …/jobs/{id}</code>, <code>POST …/jobs/{id}/cancel</code>, <code>POST …/jobs/{id}/retry</code></p>
</section>

<h2 id="jobs-what-stays-synchronous-and-the-word-import">Jobs: what stays synchronous, and the word &quot;import&quot;</h2>
<p>&quot;Import&quot; means two different things in this code:</p>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Today</th>
<th>v2</th>
</tr>
</thead>
<tbody>
<tr>
<td>Add papers by PMID (<code>fetch-by-pmid</code>)</td>
<td>One request per PMID, browser-driven</td>

<tr>

<td>One request per file</td>
<td><strong>Stays synchronous.</strong> The bytes have to come from the browser anyway, and storing them takes under a second.</td>
</tr>
<tr>
<td>Run AI extraction</td>
<td>One request per paper</td>
<td><strong>Job</strong>, for one paper or many</td>
</tr>
<tr>
<td>Import model-output JSONs (<code>/api/import</code>)</td>
<td>One request</td>
<td>Stays synchronous, managers only</td>
</tr>
</tbody>
</table>
<p>The UI keeps the existing stepper and modal. The rows just get their state from the job instead of from in-flight fetches. A <strong>Jobs</strong> panel in each project lists recent jobs with progress, so you can leave and come back.</p>

<h2 id="r2-assignment-and-status">R2: assignment and status</h2>
<p><strong>On <code>papers</code>:</strong> <code>assignee_id</code>, <code>status</code>, <code>status_reason</code>, <code>status_by</code>, <code>status_at</code>, plus a <code>paper_events</code> table (who changed assignment or status, from → to, why, when)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>                claim / assign                 submit
 unassigned ─────────────────────▶ in progress ─────────▶ submitted
     ▲          reassign keeps it ▲     │  exclude / unextractable (reason required)
     └──── unassign (manager) ────┘     └──────────────▶ excluded · unextractable
                    reopen (manager, logged) ◀── submitted / excluded / unextractable
</code></pre>
<ul>
<li><strong>Claim is atomic:</strong> <code>UPDATE … SET assignee_id=? WHERE assignee_id IS NULL</code>, then check one row changed. Two curators clicking at once can't both win.</li>
<li><strong>Edit lock (M7):</strong> saving runs, group items and PMID identity checks <code>assignee == me AND status == in progress</code>. Otherwise you get 403 &quot;assigned to &lt;name&gt;&quot;. A manager who wants to edit reassigns the paper to themselves.</li>
<li><strong>Work queue (M3):</strong> the paper list splits into <strong>My papers</strong> and <strong>Pool</strong>, with a status filter and a status badge on each row</li>
<li><strong>Reopen</strong> isn't in the SRS, but without it one wrong &quot;submit&quot; is permanent ⓓ</li>
</ul>
</section>

<h2 id="deployment-runbook-handed-to-the-sysadmin">Deployment runbook (handed to the sysadmin)</h2>
<table>
<thead>
<tr>
<th>Item</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>Code / data</td>
<td><code>/opt/annotaid</code> (code), <code>/var/lib/annotaid</code> (DB, PDF blobs, backups), owned by a dedicated <code>annotaid</code> user</td>
</tr>
<tr>
<td>Python</td>
<td>system <code>python3</code> (3.9), or <code>python3.11</code> from dnf ⓓ; venv + <code>jsonschema</code> (wheel shipped with the release in case PyPI is blocked)</td>
</tr>
<tr>
<td>Secrets</td>
<td><code>/etc/annotaid/env</code>, mode 0600: <code>OPENROUTER_API_KEY</code>, <code>NCBI_API_KEY</code>, <code>UNPAYWALL_EMAIL</code>, bootstrap admin</td>
</tr>
<tr>
<td>Service</td>
<td>systemd unit, <code>--host 127.0.0.1 --port &lt;free port&gt;</code>, <code>Restart=on-failure</code>, <strong>exactly one instance</strong> (NFR-11)</td>
</tr>
<tr>
<td>nginx</td>
<td>server block (or location), <code>proxy_pass http://127.0.0.1:&lt;port&gt;</code>, <code>client_max_body_size 64m</code> (matches <code>MAX_BODY</code>), <code>proxy_read_timeout 300s</code>, pass <code>Host</code> / <code>X-Forwarded-For</code> / <code>X-Forwarded-Proto</code>, HTTP → HTTPS redirect</td>
</tr>
<tr>
<td><strong>SELinux</strong></td>
<td>Rocky enforces it. nginx → local port needs <code>setsebool -P httpd_can_network_connect 1</code> (or label the port). This is the classic &quot;502 Bad Gateway for no reason&quot;.</td>
</tr>
<tr>
<td>Outbound</td>
<td>OpenRouter, NCBI E-utils + web, PMC + its open-data store, OpenAlex, Unpaywall, Europe PMC (NFR-8)</td>
</tr>
<tr>
<td>Backups</td>
<td>The app writes a nightly <code>sqlite3</code> backup (online, safe while running) to <code>/var/lib/annotaid/backups</code>, keeping 14. Sysadmin includes <code>/var/lib/annotaid</code> in the host's existing backups (that covers the PDFs).</td>
</tr>
<tr>
<td>Upgrades</td>
<td>Release tarball → unpack → <code>systemctl restart annotaid</code></td>
</tr>
</tbody>
</table>
</section>

<h2 id="where-it-lives-and-what-data-it-starts-with">Where it lives, and what data it starts with</h2>
<p><strong>URL.</strong> The frontend uses absolute paths everywhere (<code>/api/...</code>, <code>/p/{pid}</code>, <code>/static/...</code>).</p>
<ul>
<li><strong>Own subdomain</strong> (e.g. <code>annotaid.&lt;institution&gt;</code>): works as is</li>
<li><strong>Sub-path</strong> (e.g. <code>&lt;host&gt;/annotaid/</code>): needs a base-path setting threaded through <code>api.js</code>, the HTML shells and the redirects. About +2 h, and another thing to test.</li>
</ul>
<p><strong>Data at go-live.</strong> The server DB starts empty at schema v6.</p>
<ul>
<li>Projects move across with the existing <strong>download config file → create project from file</strong> flow</li>
<li>Papers get re-added with a PMID import job, which goes fast on the new runner</li>
<li><strong>Curated values from local instances don't move automatically.</strong> If any local curation work must survive, it needs a one-off migration script (~2 h).</li>
</ul>
<div class="ask">
<p><strong>Decision 4:</strong> subdomain or sub-path? <strong>Decision 5:</strong> start fresh, or does local curation work have to come over?</p>
</div>
</section>
