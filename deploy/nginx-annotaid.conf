# nginx server block for AnnotAid. Drop into /etc/nginx/conf.d/annotaid.conf
# (one copy per hostname, or list both in server_name).
#
#   testing:     annotaid.tibly.net
#   production:  annotaid.afrigen-d.org
#
# The app always lives at "/" of its own hostname. Certificates: whatever this
# server already uses for its other sites (e.g. certbot --nginx -d <host>).

server {
    listen 80;
    listen [::]:80;
    server_name annotaid.afrigen-d.org;
    # Plain HTTP only redirects (NFR-5). Keep the ACME path if certbot uses webroot.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name annotaid.afrigen-d.org;

    ssl_certificate     /etc/letsencrypt/live/annotaid.afrigen-d.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annotaid.afrigen-d.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # PDF uploads: matches the app's own 64 MB limit (server/app.py MAX_BODY).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # The app checks Origin against Host for CSRF, and builds invite links
        # from Host + X-Forwarded-Proto: both MUST be passed through unchanged.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Connection        "";

        # Uploads and the database snapshot download can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}
